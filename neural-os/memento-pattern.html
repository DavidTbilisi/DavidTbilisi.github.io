<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memento Pattern — Visual Walkthrough</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --text: #e6edf3; --muted: #8b949e;
    --accent: #79c0ff; --pick: #f78166;
    --origin: #ffa657; --mem: #79c0ff; --care: #d2a8ff; --restore: #7ee787;
    --warn: #f85149;
    --hl: rgba(247, 129, 102, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 1200px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; min-height: 100vh; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  h1 small { color: var(--muted); font-weight: 400; }
  .step-count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
  main { display: grid; grid-template-columns: 1.05fr 1fr; gap: 18px; flex: 1; min-height: 480px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; min-height: 0; }
  .label { margin: 0 0 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
  .narration { font-size: 15px; line-height: 1.6; margin: 0 0 14px; min-height: 56px; }
  .narration b { color: var(--accent); font-weight: 600; }
  .narration .pill { display: inline-block; padding: 1px 7px; border-radius: 4px; background: var(--hl); color: var(--pick); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  svg { flex: 1; width: 100%; min-height: 340px; }
  .code { flex: 1; overflow: auto; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .code pre { margin: 0; white-space: pre; }
  .ln { display: block; padding: 0 10px; border-left: 2px solid transparent; }
  .ln.hl { background: var(--hl); border-left-color: var(--pick); }
  .c { color: var(--muted); font-style: italic; }
  .k { color: #ff7b72; }
  .s { color: #a5d6ff; }
  .n { color: #d2a8ff; }
  .t { color: #7ee787; }
  nav { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
  .progress { flex: 1; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--pick)); transition: width .35s ease; width: 0; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 8px 18px; border-radius: 7px; cursor: pointer; font: inherit; transition: all .15s; min-width: 96px; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 10px; }
  .originator-box { fill: var(--panel); stroke: var(--origin); stroke-width: 2; transition: stroke .35s; }
  .originator-box.restoring { stroke: var(--restore); animation: pulse 0.8s ease-out 2; }
  @keyframes pulse { 0%,100% { filter: drop-shadow(0 0 0 var(--restore)); } 50% { filter: drop-shadow(0 0 14px var(--restore)); } }
  .o-label { fill: var(--text); font: 700 14px sans-serif; text-anchor: middle; }
  .o-state { fill: var(--origin); font: 600 13px ui-monospace, monospace; text-anchor: middle; transition: opacity .35s; }
  .mem { transition: opacity .35s, transform .35s; transform-origin: center; transform-box: fill-box; }
  .mem.glow { filter: drop-shadow(0 0 12px var(--mem)); }
  .mem-label { font: 600 10px ui-monospace, monospace; text-anchor: middle; fill: #0d1117; }
  .mem-sub { font: 500 9px ui-monospace, monospace; text-anchor: middle; fill: #0d1117; opacity: 0.75; }
  .caretaker-box { fill: var(--panel); stroke: var(--care); stroke-width: 1.5; stroke-dasharray: 5 3; transition: opacity .35s; }
  .care-label { fill: var(--muted); font: 600 11px ui-monospace, monospace; text-anchor: middle; }
  .save-arrow { stroke: var(--mem); stroke-width: 2; fill: none; marker-end: url(#arrowM); opacity: 0; transition: opacity .35s; stroke-dasharray: 4 3; }
  .save-arrow.on { opacity: 1; animation: dash 0.8s linear infinite; }
  .restore-arrow { stroke: var(--restore); stroke-width: 2; fill: none; marker-end: url(#arrowR); opacity: 0; transition: opacity .35s; stroke-dasharray: 4 3; }
  .restore-arrow.on { opacity: 1; animation: dash-back 0.8s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -14; } }
  @keyframes dash-back { to { stroke-dashoffset: 14; } }
  .caption { fill: var(--muted); font: 600 10px ui-monospace, monospace; text-anchor: middle; }
  .opaque-x { fill: var(--warn); font: 600 12px ui-monospace, monospace; text-anchor: middle; opacity: 0; transition: opacity .3s; }
  .opaque-x.on { opacity: 1; }
  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>The Memento Pattern <small>— a visual walkthrough</small></h1>
    <div class="step-count">Step <span id="curr">1</span> of <span id="total">6</span> · <span id="title"></span></div>
  </header>

  <main>
    <section class="panel">
      <p class="label">Scene</p>
      <p class="narration" id="narration"></p>
      <svg id="stage" viewBox="0 0 520 360" preserveAspectRatio="xMidYMid meet">
        <defs>
          <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--mem)"/>
          </marker>
          <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--restore)"/>
          </marker>
        </defs>

        <g id="originator">
          <rect class="originator-box" id="o-box" x="40" y="50" width="160" height="100" rx="8"/>
          <text class="o-label" x="120" y="80">Editor</text>
          <text class="o-state" id="o-state" x="120" y="108">text = "hello"</text>
          <text class="o-state" id="o-cursor" x="120" y="128">cursor = 5</text>
        </g>

        <text id="opaque-x" class="opaque-x" x="120" y="170">⚠ private — outsiders can't read it</text>

        <g id="caretaker">
          <rect class="caretaker-box" id="care-box" x="280" y="30" width="220" height="240" rx="8"/>
          <text class="care-label" x="390" y="50">History (Caretaker)</text>
        </g>

        <g id="mem-1" class="mem" style="opacity: 0">
          <rect x="300" y="70" width="180" height="44" rx="5" fill="var(--mem)" opacity="0.9"/>
          <text class="mem-label" x="390" y="90">Memento #1</text>
          <text class="mem-sub" x="390" y="106">snapshot: "hello" cursor=5</text>
        </g>
        <g id="mem-2" class="mem" style="opacity: 0">
          <rect x="300" y="124" width="180" height="44" rx="5" fill="var(--mem)" opacity="0.75"/>
          <text class="mem-label" x="390" y="144">Memento #2</text>
          <text class="mem-sub" x="390" y="160">snapshot: "hello!" cursor=6</text>
        </g>
        <g id="mem-3" class="mem" style="opacity: 0">
          <rect x="300" y="178" width="180" height="44" rx="5" fill="var(--mem)" opacity="0.55"/>
          <text class="mem-label" x="390" y="198">Memento #3</text>
          <text class="mem-sub" x="390" y="214">snapshot: "hello!?" cursor=7</text>
        </g>

        <path id="save-arr" class="save-arrow" d="M 200 92 L 295 92"/>
        <path id="restore-arr" class="restore-arrow" d="M 295 92 L 200 92"/>

        <text id="caption" class="caption" x="260" y="320"></text>
      </svg>
    </section>

    <section class="panel">
      <p class="label">Code</p>
      <div class="code"><pre id="code"></pre></div>
    </section>
  </main>

  <nav>
    <button id="prev">← Back</button>
    <div class="progress"><div id="bar"></div></div>
    <button id="next">Next →</button>
  </nav>
  <div class="hint">Use ← / → arrow keys to navigate</div>
</div>

<script>
const steps = [
  {
    title: "the problem",
    narration: `You want <span class="pill">undo</span> on an Editor. The naive fix: expose its <span class="pill">text</span> and <span class="pill">cursor</span> fields so a history class can read and restore them. Now encapsulation is gone — any caller can poke private state.`,
    code: [
      '<span class="k">class</span> <span class="t">Editor</span> {',
      '  <span class="k">public</span> text = <span class="s">""</span>      <span class="c">// ← had to expose</span>',
      '  <span class="k">public</span> cursor = <span class="n">0</span>    <span class="c">// ← had to expose</span>',
      '}',
      '',
      'history.push({ text: editor.text, cursor: editor.cursor })',
      '<span class="c">// every consumer can now mutate the editor\'s internals.</span>',
    ],
    state: { oState: 'text = "hello"', cursor: 'cursor = 5', mems: 0, save: false, restore: false, restoring: false, opaque: true, caption: "exposing fields kills the invariants — a thousand callers can break the editor" }
  },
  {
    title: "the object snapshots itself",
    narration: `The <b>Originator</b> (Editor) creates its own <b>Memento</b> — a frozen capsule of its current state. The Memento is opaque to outsiders. Only the Originator can read it back.`,
    code: [
      '<span class="k">class</span> <span class="t">EditorMemento</span> {',
      '  <span class="k">constructor</span>(',
      '    <span class="k">readonly</span> text:   <span class="t">string</span>,',
      '    <span class="k">readonly</span> cursor: <span class="t">number</span>',
      '  ) {}',
      '}',
      '',
      '<span class="k">class</span> <span class="t">Editor</span> {',
      '  <span class="k">private</span> text = <span class="s">""</span>; <span class="k">private</span> cursor = <span class="n">0</span>',
      '  save():   <span class="t">EditorMemento</span> { <span class="k">return</span> <span class="k">new</span> EditorMemento(<span class="k">this</span>.text, <span class="k">this</span>.cursor) }',
      '  restore(m: <span class="t">EditorMemento</span>) { <span class="k">this</span>.text = m.text; <span class="k">this</span>.cursor = m.cursor }',
      '}',
    ],
    state: { oState: 'text = "hello"', cursor: 'cursor = 5', mems: 1, save: true, restore: false, restoring: false, opaque: false, caption: "Editor owns both directions; fields stay private" }
  },
  {
    title: "the Caretaker holds, never reads",
    narration: `A <b>Caretaker</b> stores Mementos in a stack. Crucially, it treats them as <b>opaque</b> — it never inspects fields. It only knows "I have a thing the Editor gave me; I can hand it back later."`,
    code: [
      '<span class="k">class</span> <span class="t">History</span> {',
      '  <span class="k">private</span> snapshots: <span class="t">EditorMemento</span>[] = []',
      '  push(m: <span class="t">EditorMemento</span>) { <span class="k">this</span>.snapshots.push(m) }',
      '  pop():        <span class="t">EditorMemento</span> | <span class="k">undefined</span> {',
      '    <span class="k">return</span> <span class="k">this</span>.snapshots.pop()',
      '  }',
      '  <span class="c">// History never reads m.text or m.cursor.</span>',
      '}',
    ],
    state: { oState: 'text = "hello!"', cursor: 'cursor = 6', mems: 2, save: true, restore: false, restoring: false, opaque: false, caption: "Caretaker keeps the capsule sealed" }
  },
  {
    title: "restore",
    narration: `On undo, the Caretaker pops the top Memento and the Editor restores its state from it. The Memento is the only object that ever touches the private fields — the wire is short and one-way.`,
    code: [
      '<span class="k">function</span> undo(editor: <span class="t">Editor</span>, history: <span class="t">History</span>) {',
      '  <span class="k">const</span> m = history.pop()',
      '  <span class="k">if</span> (m) editor.restore(m)',
      '}',
      '',
      'editor.setText(<span class="s">"hello!"</span>); history.push(editor.save())',
      'editor.setText(<span class="s">"hello!?"</span>); history.push(editor.save())',
      'undo(editor, history)   <span class="c">// → back to "hello!"</span>',
    ],
    state: { oState: 'text = "hello!"', cursor: 'cursor = 6', mems: 3, save: false, restore: true, restoring: true, opaque: false, caption: "Editor pulls its own past back from the capsule" }
  },
  {
    title: "branching & checkpoints",
    narration: `Because each Memento is just a value, you can keep multiple — checkpoint trees, named save-slots, "go back to commit X". Games, IDEs, transactional systems all sit on this pattern.`,
    code: [
      '<span class="k">const</span> beforeFight = editor.save()',
      'editor.applyEdit(risky)',
      '<span class="k">if</span> (preview.looksBad()) editor.restore(beforeFight)   <span class="c">// roll back one path</span>',
      '',
      '<span class="c">// game save slots</span>',
      'saves.set(<span class="s">"slot-1"</span>, hero.save())',
      'saves.set(<span class="s">"slot-2"</span>, hero.save())',
      'hero.restore(saves.get(<span class="s">"slot-1"</span>))',
    ],
    state: { oState: 'text = "hello"', cursor: 'cursor = 5', mems: 3, save: true, restore: false, restoring: false, opaque: false, caption: "memento is a value — checkpoint, branch, name it, share it" }
  },
  {
    title: "the trade-off",
    narration: `Memento preserves encapsulation while enabling undo/checkpoint/replay. Pays off when the protected state is real and external history is required. Costs memory — every snapshot is a deep copy, big objects can balloon. Mitigations: incremental mementos (diff from last), copy-on-write. Close cousin of <b>[[command-pattern]]</b> (Command captures the *action* to reverse; Memento captures the *state* to restore — often paired, both inside an editor's undo stack) and <b>[[prototype-pattern]]</b> (both rely on deep copy of internals).`,
    code: [
      '<span class="c">// good fit:</span>',
      '<span class="c">//   - editor undo where actions are too varied to invert (use with Command)</span>',
      '<span class="c">//   - game save slots / checkpoints</span>',
      '<span class="c">//   - transactional rollback</span>',
      '<span class="c">//   - "compare to last run" / time travel debugging</span>',
      '',
      '<span class="c">// poor fit:</span>',
      '<span class="c">//   - state too large to snapshot per step (use incremental, or Command-only)</span>',
      '<span class="c">//   - external state (database, network) — snapshot doesn\'t cover it</span>',
    ],
    state: { oState: 'text = "hello"', cursor: 'cursor = 5', mems: 3, save: false, restore: false, restoring: false, opaque: false, caption: "use it when undo must respect encapsulation" }
  },
];

const $ = (id) => document.getElementById(id);
let idx = 0;
$('total').textContent = steps.length;

function render() {
  const s = steps[idx];
  $('curr').textContent = idx + 1;
  $('title').textContent = s.title;
  $('narration').innerHTML = s.narration;
  $('bar').style.width = `${((idx + 1) / steps.length) * 100}%`;
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === steps.length - 1;
  $('code').innerHTML = s.code.map(line => `<span class="ln">${line || '&nbsp;'}</span>`).join('');

  $('o-state').textContent = s.state.oState;
  $('o-cursor').textContent = s.state.cursor;
  for (let i = 1; i <= 3; i++) $('mem-' + i).style.opacity = (s.state.mems >= i) ? '' : 0;
  $('save-arr').classList.toggle('on', s.state.save);
  $('restore-arr').classList.toggle('on', s.state.restore);
  $('o-box').classList.toggle('restoring', s.state.restoring);
  $('opaque-x').classList.toggle('on', s.state.opaque);
  $('caption').textContent = s.state.caption || '';
}

function go(d) {
  const n = Math.max(0, Math.min(steps.length - 1, idx + d));
  if (n === idx) return;
  idx = n; render();
}

$('prev').addEventListener('click', () => go(-1));
$('next').addEventListener('click', () => go(1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft')  { e.preventDefault(); go(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
});
render();
</script>
  <script src="tools/explain-viz/walkthrough-graph.js" defer></script>
  <script src="tools/explain-viz/walkthrough-nav.js" defer></script>
</body>
</html>
