  const code = `<pre>
<span class="ln"><span class="k">from</span> psl <span class="k">import</span> <span class="t">Problem</span></span>
<span class="ln"></span>
<span class="ln"><span class="c"># 1. Frame</span></span>
<span class="ln">p = <span class="t">Problem</span>(</span>
<span class="ln">  given   = <span class="s">"G=(V,E), weights w≥0, source s"</span>,</span>
<span class="ln">  unknown = <span class="s">"shortest distance d[v] for all v"</span>,</span>
<span class="ln">  success = <span class="s">"d[v] == true shortest path"</span>)</span>
<span class="ln"></span>
<span class="ln"><span class="c"># 2–3. Inventory → Represent</span></span>
<span class="ln">p.inventory()          <span class="c"># facts: w≥0, sparse, directed</span></span>
<span class="ln">p.represent(<span class="s">'graph'</span>)  <span class="c"># adj-list + min-priority queue</span></span>
<span class="ln"></span>
<span class="ln"><span class="c"># 4. Probe — cheap experiments</span></span>
<span class="ln">p.probe([<span class="s">'n=1'</span>, <span class="s">'n=2'</span>, <span class="s">'cycle'</span>])</span>
<span class="ln"><span class="c"># → settled nodes stay settled (key observation)</span></span>
<span class="ln"></span>
<span class="ln"><span class="c"># 5–6. Generate + Evaluate</span></span>
<span class="ln">moves = p.generate_moves()</span>
<span class="ln"><span class="c"># [relax-edge, backward-from-goal,</span></span>
<span class="ln"><span class="c">#  search-invariant: settled-set]</span></span>
<span class="ln">best = p.evaluate(moves,</span>
<span class="ln">  criterion=<span class="s">'uncertainty_reduction'</span>)</span>
<span class="ln"></span>
<span class="ln"><span class="c"># 7–8. Formalize + Distill</span></span>
<span class="ln">p.formalize(best)   <span class="c"># → Dijkstra's algorithm</span></span>
<span class="ln">rule = p.distill()</span>
<span class="ln"><span class="c"># "greedy expansion: works when relaxation is monotone"</span></span>
<span class="ln">p.encode_spear(rule) <span class="c"># handoff → SPEAR encoder</span></span>
</pre>`;
