  // ──────────────────────────────────────────────────────────────
  // Code panel: the whole system as one runnable Python spec.

  const code = `<pre>
<span class="ln"><span class="c"># The whole system as one spec — clusters, tools, pass floors.</span></span>
<span class="ln"><span class="n">CLUSTERS</span> = {</span>
<span class="ln">  <span class="s">"NUMERIC"</span>:       <span class="k">dict</span>(themes=[17,18,25],             q=46,  tool=<span class="s">"peg_matrix"</span>),</span>
<span class="ln">  <span class="s">"VISUAL_SIGN"</span>:   <span class="k">dict</span>(themes=[3,4,5,6,7,8,9,12,13,28], q=280, tool=<span class="s">"glyph_grammar"</span>),</span>
<span class="ln">  <span class="s">"RULE_ENGINE"</span>:   <span class="k">dict</span>(themes=[10,11,15,16,19,20,21,22,23], q=345, tool=<span class="s">"priority_lattice"</span>),</span>
<span class="ln">  <span class="s">"PROPOSITIONAL"</span>: <span class="k">dict</span>(themes=[1,14,24,26,27,29,30,31], q=360, tool=<span class="s">"nedf_tables + sr_deck"</span>),</span>
<span class="ln">}</span>
<span class="ln"><span class="n">PHASES</span> = [<span class="s">"NUMERIC"</span>, <span class="s">"VISUAL_SIGN"</span>, <span class="s">"RULE_ENGINE"</span>, <span class="s">"PROPOSITIONAL"</span>]  <span class="c"># smallest bin first</span></span>
<span class="ln"></span>
<span class="ln"><span class="k">def</span> <span class="n">derive</span>(scene):</span>
<span class="ln">    <span class="s">"""C-L-S-R: intersections are derived, never memorized."""</span></span>
<span class="ln">    <span class="k">for</span> authority <span class="k">in</span> (<span class="s">"controller"</span>, <span class="s">"lights"</span>, <span class="s">"signs"</span>):</span>
<span class="ln">        <span class="k">if</span> scene.has(authority):</span>
<span class="ln">            <span class="k">return</span> scene.obey(authority)   <span class="c"># higher silences lower</span></span>
<span class="ln">    <span class="k">return</span> scene.right_hand_rule()         <span class="c"># equal roads fallback</span></span>
<span class="ln"></span>
<span class="ln"><span class="k">def</span> <span class="n">distractor_shape</span>(options):</span>
<span class="ln">    <span class="k">if</span> has_both_clause(options):   <span class="k">return</span> <span class="s">"only-vs-both swap"</span></span>
<span class="ln">    <span class="k">if</span> near_neighbors(options):    <span class="k">return</span> <span class="s">"near-neighbor number"</span></span>
<span class="ln">    <span class="k">return</span> <span class="s">"vehicle-type substitution"</span></span>
<span class="ln"></span>
<span class="ln"><span class="k">def</span> <span class="n">ready</span>(meter):                            <span class="c"># floor sits ABOVE official 25/30</span></span>
<span class="ln">    <span class="k">return</span> <span class="k">all</span>(s &gt;= 27 <span class="k">for</span> s <span class="k">in</span> meter.last_simulations(3))</span>
</pre>`;
